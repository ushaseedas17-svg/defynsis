<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DefenSys — Prototype</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FC; --surface:#EDF0F7; --card:#FFFFFF; --border:#E8EAF0; --border-strong:#D8DCE6; --track:#EEF0F4;
    --text:#10151F; --text-dim:#6B7280; --text-faint:#9CA3AF;
    --blue:#1D6FE0; --blue-dim:#EAF1FD;
    --teal:#00BFA6; --teal-dim:#E3F9F5;
    --low:#1FBF8F; --low-dim:#E5F8F1;
    --mod:#FFA531; --mod-dim:#FFF3E1;
    --high:#FF7A45; --high-dim:#FFEDE4;
    --crit:#FF4757; --crit-dim:#FFE7E9;
    --font-d:'Manrope',sans-serif; --font-b:'Inter',sans-serif;
    --shadow-sm:0 1px 2px rgba(16,21,31,0.04);
    --shadow-md:0 4px 16px rgba(16,21,31,0.06);
    --shadow-lg:0 16px 40px -8px rgba(16,21,31,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#FFFFFF;
    font-family:var(--font-b); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:40px 16px 80px; gap:32px;
  }
  .rig{display:flex; gap:40px; flex-wrap:wrap; justify-content:center; align-items:flex-start;}

  .phone{
    width:368px; height:750px; background:#F4F6FC; border-radius:44px;
    border:10px solid #05070D; box-shadow:0 30px 70px -20px rgba(16,21,31,0.25), 0 8px 24px -8px rgba(16,21,31,0.12);
    position:relative; overflow:hidden; display:flex; flex-direction:column;
  }
  .notch{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:120px; height:22px; background:#05070D; border-radius:12px; z-index:10;
  }
  .statusbar{
    padding:22px 22px 6px; display:flex; justify-content:space-between; align-items:center;
    font-size:12px; color:var(--text-dim); font-weight:500; position:relative; z-index:1;
  }
  .watchpill{
    display:flex; align-items:center; gap:6px; padding:5px 11px; border-radius:20px;
    background:var(--surface); border:1px solid var(--border); cursor:pointer;
    font-size:11px; font-weight:600; transition:border-color .2s;
  }
  .watchpill.connected{color:var(--low);}
  .watchpill.disconnected{color:var(--crit);}
  .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
  .dot.pulse{animation:blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1} 50%{opacity:.3}}

  .screen{flex:1; padding:10px 22px 22px; overflow-y:auto; display:flex; flex-direction:column; gap:18px; position:relative; background:
      radial-gradient(560px 340px at -10% -10%, rgba(93,157,255,0.28), transparent 55%),
      radial-gradient(480px 320px at 115% 8%, rgba(0,214,190,0.22), transparent 55%),
      radial-gradient(520px 360px at 105% 95%, rgba(158,119,255,0.16), transparent 55%),
      radial-gradient(460px 300px at -5% 85%, rgba(255,141,110,0.10), transparent 55%),
      linear-gradient(170deg, #F8FAFF 0%, #F2F4FB 55%, #EEF1F9 100%);
  }
  .screen::-webkit-scrollbar{display:none;}

  h1.title{font-family:var(--font-d); font-size:22px; font-weight:800; letter-spacing:-0.01em;}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); font-weight:700;}

  /* Risk gauge card */
  .riskcard{
    background:var(--card); border:1px solid var(--border); border-radius:24px;
    padding:22px; display:flex; align-items:center; gap:18px; position:relative;
    box-shadow:0 1px 2px rgba(16,21,31,0.03), 0 10px 24px rgba(16,21,31,0.05);
  }
  .gauge-wrap{position:relative; width:104px; height:104px; flex-shrink:0;}
  .gauge-wrap svg{transform:rotate(-90deg);}
  .gauge-track{stroke:var(--track); fill:none; stroke-width:9;}
  .gauge-progress{fill:none; stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset 1s ease, stroke .4s ease;}
  .gauge-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .gauge-center .lvl{font-family:var(--font-d); font-size:15px; font-weight:800;}
  .gauge-center .lbl{font-size:9px; color:var(--text-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .risk-info .eyebrow{margin-bottom:4px;}
  .risk-info .headline{font-family:var(--font-d); font-size:16px; font-weight:700;}
  .risk-info .sub{font-size:11.5px; color:var(--text-dim); margin-top:4px; line-height:1.5;}
  .risk-chip{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:10.5px; font-weight:700; margin-top:8px;}

  /* Status card */
  .statuscard{
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:18px 20px; display:flex; align-items:center; gap:14px;
    box-shadow:0 1px 2px rgba(16,21,31,0.03); position:relative;
  }
  .statusicon{width:42px; height:42px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;}
  .statuscard .big{font-family:var(--font-d); font-size:14.5px; font-weight:700;}
  .statuscard .sub{font-size:11.5px; color:var(--text-dim); margin-top:1px;}

  /* SOS */
  .sos-wrap{display:flex; flex-direction:column; align-items:center; gap:12px; padding:6px 0 2px;}
  .ring-outer{width:164px; height:164px; position:relative; display:flex; align-items:center; justify-content:center;}
  .ring-outer svg{position:absolute; top:0; left:0; transform:rotate(-90deg); pointer-events:none;}
  .cd-track{stroke:var(--track); fill:none; stroke-width:3;}
  .cd-progress{stroke:var(--crit); fill:none; stroke-width:3; stroke-linecap:round; transition:stroke-dashoffset 1s linear;}
  .sos-btn{
    width:126px; height:126px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(155deg,#FF8A6B,#FF4757 65%);
    color:#fff; font-family:var(--font-d); font-weight:800; font-size:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    box-shadow:0 12px 28px -6px rgba(255,71,87,0.45);
    animation:sospulse 2.4s ease-in-out infinite;
    position:relative; z-index:1;
  }
  .sos-btn i{font-size:23px;}
  @keyframes sospulse{
    0%{box-shadow:0 12px 28px -6px rgba(255,71,87,0.45), 0 0 0 0 rgba(255,71,87,0.25)}
    70%{box-shadow:0 12px 28px -6px rgba(255,71,87,0.45), 0 0 0 20px rgba(255,71,87,0)}
    100%{box-shadow:0 12px 28px -6px rgba(255,71,87,0.45), 0 0 0 0 rgba(255,71,87,0)}
  }
  .sos-hint{font-size:11px; color:var(--text-faint); text-align:center; max-width:230px;}

  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .tile{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:15px; display:flex; flex-direction:column; gap:9px; cursor:pointer;
    box-shadow:0 1px 2px rgba(16,21,31,0.03); transition:border-color .15s, transform .15s;
  }
  .tile:hover{border-color:var(--border-strong); transform:translateY(-1px);}
  .tile-vivid{border:none; box-shadow:0 10px 24px -10px rgba(16,21,31,0.3);}
  .tile-vivid:hover{transform:translateY(-2px); box-shadow:0 14px 28px -10px rgba(16,21,31,0.35);}
  .tile .ic{width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .tile .t{font-size:12.5px; font-weight:700; font-family:var(--font-b);}
  .tile .s{font-size:10.5px; color:var(--text-dim);}

  .navbar{
    display:flex; justify-content:space-between; align-items:center; gap:4px;
    margin:0 14px 16px; padding:8px; border-radius:24px;
    background:#FFFFFF; box-shadow:0 8px 24px -8px rgba(16,21,31,0.14), 0 1px 2px rgba(16,21,31,0.04);
    border:1px solid var(--border); position:relative; z-index:1;
  }
  .navitem{
    display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
    color:var(--text-faint); font-size:9.5px; font-weight:700; background:none; border:none;
    flex:1; padding:8px 4px; border-radius:16px; transition:background .18s ease, color .18s ease;
  }
  .navitem span{font-size:19px; line-height:1;}
  .navitem.active{color:var(--blue); background:var(--blue-dim);}

  .list{display:flex; flex-direction:column; gap:10px;}
  .row{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:13px 15px; display:flex; align-items:center; gap:12px; box-shadow:0 1px 2px rgba(16,21,31,0.03);}
  .row .ic{width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:15px; background:var(--surface); color:var(--text-dim); flex-shrink:0;}
  .row .name{font-size:13px; font-weight:700;}
  .row .meta{font-size:10.5px; color:var(--text-dim);}
  .badge{margin-left:auto; font-size:10px; font-weight:700; padding:4px 9px; border-radius:20px;}
  .badge.notified{background:var(--low-dim); color:var(--low);}
  .badge.pending{background:var(--surface); color:var(--text-faint);}
  .badge.live{background:var(--crit-dim); color:var(--crit);}
  .badge.connecting{background:var(--mod-dim); color:var(--mod);}

  .notice-row{border-style:dashed !important; background:var(--surface) !important;}
  .activate-btn{width:100%; background:var(--crit); color:#fff; border:1.5px solid var(--crit); padding:14px; border-radius:14px; font-family:var(--font-b); font-weight:700; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:auto;}

  .em-header{display:flex; flex-direction:column; align-items:center; gap:10px; padding:6px 0;}
  .em-ring{width:132px; height:132px; border-radius:50%; background:var(--crit-dim); display:flex; align-items:center; justify-content:center;}
  .em-ring .core{width:80px; height:80px; border-radius:50%; background:linear-gradient(155deg,#FF8A6B,#FF4757); display:flex; align-items:center; justify-content:center; font-size:30px; color:#fff; animation:sospulse 1.8s ease-in-out infinite;}
  .em-title{font-family:var(--font-d); font-size:18px; font-weight:800; color:var(--crit); text-align:center;}
  .em-sub{font-size:11.5px; color:var(--text-dim); text-align:center; max-width:260px; line-height:1.5;}
  .steps{display:flex; flex-direction:column; gap:9px;}
  .step{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--card); border:1px solid var(--border); border-radius:14px; opacity:0.35; transition:opacity .3s; box-shadow:0 1px 2px rgba(16,21,31,0.03);}
  .step.done{opacity:1;}
  .step .chk{width:21px; height:21px; border-radius:50%; border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:11px; color:#fff;}
  .step.done .chk{background:var(--low); border-color:var(--low);}
  .step .label{font-size:12px; font-weight:600;}
  .safe-btn{margin-top:auto; background:var(--surface); border:1px solid var(--border-strong); color:var(--text); padding:14px; border-radius:14px; font-family:var(--font-b); font-weight:700; font-size:13px; cursor:pointer;}

  .grace-title{font-family:var(--font-d); font-size:17px; font-weight:800; text-align:center;}
  .grace-sub{font-size:11.5px; color:var(--text-dim); text-align:center;}

  .toast{position:absolute; bottom:96px; left:20px; right:20px; background:var(--card); border:1px solid var(--border-strong); border-radius:16px; padding:14px 16px; font-size:11.5px; color:var(--text-dim); display:flex; gap:10px; align-items:flex-start; z-index:20; box-shadow:0 16px 34px rgba(16,21,31,0.14);}
  .toast strong{color:var(--text); display:block; margin-bottom:2px; font-size:12px;}
  .toast-actions{display:flex; align-items:center; gap:10px; margin-top:9px;}
  .toast-dismiss{background:var(--text); color:#fff; border:none; padding:6px 14px; border-radius:20px; font-size:11px; font-weight:700; cursor:pointer; font-family:var(--font-b);}
  .toast-auto{font-size:10px; color:var(--text-faint); font-weight:600;}
  .toast i.warn{color:var(--mod); font-size:16px; flex-shrink:0; margin-top:1px;}
  .toast-x{margin-left:auto; background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:15px; flex-shrink:0; padding:2px;}

  /* Live vitals */
  .vitalscard{background:var(--card); border:1px solid var(--border); border-radius:20px; padding:16px 18px; box-shadow:0 1px 2px rgba(16,21,31,0.03); position:relative;}
  .vitalscard .vhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding-right:22px;}
  .vitalscard .vhead .eyebrow{margin:0;}
  .live-pill{display:flex; align-items:center; gap:5px; font-size:9.5px; font-weight:700; color:var(--low); position:relative; z-index:1;}
  .live-pill .dot{width:5px; height:5px; border-radius:50%; background:var(--low);}
  .vgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .vstat{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:6px;}
  .vstat-vivid{border:none; box-shadow:0 8px 20px -8px rgba(16,21,31,0.25);}
  .vstat .vic{width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px;}
  .vstat .vval{font-family:var(--font-d); font-size:16px; font-weight:800; margin-top:2px;}
  .vstat .vval span{font-size:10.5px; font-weight:600; color:var(--text-faint); margin-left:2px;}
  .vstat .vlbl{font-size:10px; color:var(--text-dim); font-weight:600;}

  .vbig{background:var(--card); border:1px solid var(--border); border-radius:22px; padding:20px; box-shadow:0 1px 2px rgba(16,21,31,0.03); position:relative;}
  .vbig-head{display:flex; align-items:center; justify-content:space-between;}
  .vbig-num{font-family:var(--font-d); font-size:34px; font-weight:800; display:flex; align-items:baseline; gap:6px;}
  .vbig-num span{font-size:12px; font-weight:600; color:var(--text-faint);}
  .pulse-ic{width:38px; height:38px; border-radius:12px; background:var(--crit-dim); color:var(--crit); display:flex; align-items:center; justify-content:center; font-size:17px; animation:sospulse 1.6s ease-in-out infinite; position:relative; z-index:1;}
  .spark{width:100%; height:52px; margin-top:10px;}
  .stress-row{display:flex; align-items:center; gap:14px; margin-top:4px;}
  .stress-bar-track{flex:1; height:8px; border-radius:20px; background:var(--surface); overflow:hidden;}
  .stress-bar-fill{height:100%; border-radius:20px; transition:width .8s ease, background .4s ease;}

  /* Avatar */
  .avatar-btn{width:30px; height:30px; border-radius:50%; border:1px solid var(--border-strong); background:linear-gradient(155deg,#8EC5FF,#1D6FE0); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-d); font-weight:800; font-size:12px; cursor:pointer; flex-shrink:0;}

  /* Watch connection card */
  .watchcard{background:var(--card); border:1px solid var(--border); border-radius:20px; padding:16px 18px; box-shadow:0 1px 2px rgba(16,21,31,0.03); display:flex; align-items:center; gap:14px; position:relative;}
  .watchcard .wic{width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
  .watchcard .wtitle{font-size:13px; font-weight:700;}
  .watchcard .wmeta{font-size:10.5px; color:var(--text-dim); margin-top:2px; display:flex; gap:10px; align-items:center;}
  .watchcard .wtoggle{margin-left:auto; font-size:10.5px; font-weight:700; padding:7px 13px; border-radius:20px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text); cursor:pointer; flex-shrink:0;}
  .sigbars{display:inline-flex; align-items:flex-end; gap:2px; height:10px;}
  .sigbars span{width:3px; background:var(--low); border-radius:1px;}

  /* Profile screen */
  .profile-head{display:flex; flex-direction:column; align-items:center; gap:10px; padding:8px 0 4px;}
  .avatar-lg{width:72px; height:72px; border-radius:50%; background:linear-gradient(155deg,#8EC5FF,#1D6FE0); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-d); font-weight:800; font-size:26px;}
  .profile-head .pname{font-family:var(--font-d); font-size:18px; font-weight:800;}
  .profile-head .psub{font-size:11.5px; color:var(--text-dim);}
  .edit-btn{background:var(--blue-dim); color:var(--blue); border:none; padding:9px 18px; border-radius:20px; font-size:11.5px; font-weight:700; cursor:pointer; margin-top:4px;}

  /* Map screen */
  .mapwrap{position:relative; border-radius:22px; overflow:hidden; border:1px solid var(--border); height:280px; background:
      linear-gradient(#F1F3F7,#F1F3F7),
      repeating-linear-gradient(0deg, transparent, transparent 38px, #E3E6EC 38px, #E3E6EC 40px),
      repeating-linear-gradient(90deg, transparent, transparent 54px, #E3E6EC 54px, #E3E6EC 56px);
    box-shadow:0 1px 2px rgba(16,21,31,0.03);}
  .map-road{position:absolute; background:#DCE0E8;}
  .map-pin{position:absolute; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center;}
  .map-pin .dot-outer{width:34px; height:34px; border-radius:50%; background:rgba(29,111,224,0.18); display:flex; align-items:center; justify-content:center; animation:sospulse 2s ease-in-out infinite;}
  .map-pin .dot-inner{width:16px; height:16px; border-radius:50%; background:var(--blue); border:3px solid #fff; box-shadow:0 2px 6px rgba(16,21,31,0.2);}
  .zone-pin{position:absolute; transform:translate(-50%,-100%);}
  .zone-pin .zp{width:26px; height:26px; border-radius:50% 50% 50% 0; background:var(--mod); transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(16,21,31,0.2);}
  .zone-pin .zp i{transform:rotate(45deg); color:#fff; font-size:12px;}
  .map-card{background:var(--card); border:1px solid var(--border-strong); border-radius:18px; padding:14px 16px; box-shadow:0 1px 2px rgba(16,21,31,0.03); display:flex; align-items:center; gap:12px; position:relative;}
  .map-card > div:not(.ic){padding-right:22px;}
  .card-watermark{position:absolute; top:16px; right:16px; opacity:0.9; z-index:0;}

  /* Brand */
  .brand{display:flex; align-items:center; gap:8px;}
  .brand-mark{width:22px; height:22px; flex-shrink:0;}
  .brand-word{font-family:var(--font-d); font-size:12.5px; font-weight:800; letter-spacing:-0.01em; color:var(--text);}

  /* Premium hero header */
  .hero{
    border-radius:26px; padding:22px 22px 24px; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#1D6FE0 0%,#3B8AF0 45%,#5FA8FF 100%);
    box-shadow:0 20px 40px -16px rgba(29,111,224,0.45);
  }
  .hero::before{
    content:''; position:absolute; top:-60px; right:-40px; width:200px; height:200px;
    background:radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%); border-radius:50%;
  }
  .hero-top{display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1;}
  .hero-greeting{font-family:var(--font-b); font-size:12.5px; color:#FFFFFF; font-weight:600; text-shadow:0 1px 3px rgba(0,0,0,0.15); opacity:0.95;}
  .hero-name{font-family:var(--font-d); font-size:17px; font-weight:800; color:#fff; margin-top:2px;}
  .hero-shield{width:40px; height:40px; border-radius:14px; background:rgba(255,255,255,0.18); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; font-size:18px;}
  .hero-status{display:flex; align-items:center; gap:10px; margin-top:16px; position:relative; z-index:1;}
  .hero-status-dot{width:9px; height:9px; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,0.25);}
  .hero-status-text{font-family:var(--font-d); font-size:15px; font-weight:700; color:#fff;}
  .hero-status-sub{font-size:11px; color:rgba(255,255,255,0.8); margin-top:1px;}

  /* Premium button press feedback */
  .tile, .row, .sos-btn, .wtoggle, .activate-btn, .safe-btn{transition:transform .12s ease, box-shadow .12s ease, border-color .15s ease;}
  .tile:active, .row:active{transform:scale(0.98);}
  .sos-btn:active{transform:scale(0.96);}
  /* Refined visual direction: midnight glass, softer hierarchy and warm signal colours */
  :root{
    --bg:#fff6fa; --surface:#fff0f6; --card:rgba(255,255,255,.95); --border:rgba(112,49,78,.10); --border-strong:rgba(112,49,78,.18); --track:#f5e8ee;
    --text:#321b2b; --text-dim:#806979; --text-faint:#ae98a5; --blue:#c75b88; --blue-dim:#fff0f6;

  let db = null;

      auth = getAuth(firebaseApp);
      console.info('[DefenSys] Firebase connected.');

      onAuthStateChanged(auth, (user) => {
        currentAuthUser = user
          ? { uid: user.uid, email: user.email, displayName: user.displayName }
          : null;

          window.__defensysAuthReady__(currentAuthUser);

    if (!auth) return { ok: false, error: 'Firebase Authentication is not configured yet.' };
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      if (name) await updateProfile(cred.user, { displayName: name });
      currentAuthUser = { uid: cred.user.uid, email: cred.user.email, displayName: name || null };
      return { ok: true };
    } catch (error) {
      console.error('[DefenSys] Sign-up failed:', error);
      return { ok: false, error: error.message };
    }
  };

  window.defenSysLogin = async (email, password) => {
    if (!auth) return { ok: false, error: 'Firebase Authentication is not configured yet.' };
    try {
      await signInWithEmailAndPassword(auth, email, password);
      return { ok: true };
    } catch (error) {
      console.error('[DefenSys] Login failed:', error);
      return { ok: false, error: error.message };

  window.defenSysLogout = async () => {
    if (!auth) return;
    try {
      await signOut(auth);
    } catch (error) {
      console.error('[DefenSys] Sign-out failed:', error);
    }
  };

  if ('geolocation' in navigator) {
    navigator.geolocation.getCurrentPosition(
      position => {
        currentLocation = {
          lat: Number(position.coords.latitude.toFixed(7)),
          lon: Number(position.coords.longitude.toFixed(7))

        if(typeof window.__defensysRerender__ === 'function') window.__defensysRerender__();

      error => {
        console.warn('[DefenSys] Location unavailable:', error.message);

      { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }

  window.getDefenSysLocation = () => currentLocation;
  window.writeSafetyEvent = async ({ riskLevel, heartRate, lat, lon }) => {
    if (!db) return null;
    const event = {
      riskLevel,
      heartRate: Number(heartRate),
      lat: lat ?? currentLocation.lat,
      lon: lon ?? currentLocation.lon,
      timestamp: serverTimestamp()

    try {
      const eventRef = await addDoc(collection(db, 'events'), event);
      return eventRef.id;

      console.error('[DefenSys] Firestore event write failed:', error);

  function getCurrentDeviceLocation() {
    if (!('geolocation' in navigator)) return Promise.resolve(currentLocation);
    return new Promise(resolve => {
      navigator.geolocation.getCurrentPosition(
        position => {
          currentLocation = {
            lat: Number(position.coords.latitude.toFixed(7)),
            lon: Number(position.coords.longitude.toFixed(7))
          };
          resolve(currentLocation);
        },
        error => resolve(currentLocation),
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 30000 }
      );
    });
  }

  function startLiveLocationUpdates(incidentId) {
    if (!('geolocation' in navigator)) return;
    if (liveLocationWatchId !== null) {
      navigator.geolocation.clearWatch(liveLocationWatchId);

    liveLocationWatchId = navigator.geolocation.watchPosition(
      async position => {
        currentLocation = {
          lat: Number(position.coords.latitude.toFixed(7)),
          lon: Number(position.coords.longitude.toFixed(7))
        };
        try {
          await updateDoc(doc(db, 'incidents', incidentId), {
            latitude: currentLocation.lat,
            longitude: currentLocation.lon

          console.error('[DefenSys] Live location update failed:', error);

      },
      error => {},
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
    );
  }

  window.stopDefenSysLiveLocation = () => {
    if (liveLocationWatchId !== null && 'geolocation' in navigator) {
      navigator.geolocation.clearWatch(liveLocationWatchId);
      liveLocationWatchId = null;
    }
  };

  function getDefenSysUserId() {
    if (currentAuthUser) return currentAuthUser.uid;
    const storageKey = 'defensysUserId';
    try {
      let userId = localStorage.getItem(storageKey);
      if (!userId) {
        userId = window.crypto?.randomUUID
          ? window.crypto.randomUUID()
          : `device-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        localStorage.setItem(storageKey, userId);
      }
      return userId;
    } catch (error) {
      return 'device-session';
    }
  }

  window.createDefenSysIncident = async (contactsList, triggerType = 'SOS') => {
    if (!db) return null;
    const location = await getCurrentDeviceLocation();
    const safeContacts = Array.isArray(contactsList)
      ? contactsList
          .filter(c => c && c.phone && !String(c.phone).includes('X'))
          .map(c => ({ name: c.name, phone: c.phone }))
      : [];

    const incident = {
      userId: getDefenSysUserId(),
      triggerType,
      latitude: location.lat,
      longitude: location.lon,
      contacts: safeContacts,
      timestamp: serverTimestamp(),
      status: 'active',
    };

    try {
      const incidentRef = await addDoc(collection(db, 'incidents'), incident);
      startLiveLocationUpdates(incidentRef.id);
      return incidentRef.id;

  function startCodeWordListener() {
    if (typeof window.startDefenSysCodeWordListener !== 'function') {
      console.warn('[DefenSys] java.js was not loaded, code word listener unavailable.');
      return false;
    }
    return window.startDefenSysCodeWordListener();
  }

  function handleDeviceMotion(event) {
    const acceleration = event.accelerationIncludingGravity || event.acceleration;
    if (!acceleration) return;
    const magnitude = Math.sqrt(
      (acceleration.x || 0) ** 2 +
      (acceleration.y || 0) ** 2 +
      (acceleration.z || 0) ** 2
    );
    const now = Date.now();
    if (magnitude < 22 || now - lastMotionHitAt < 180) return;

    lastMotionHitAt = now;
    motionHits = motionHits.filter(hit => now - hit < 1800);
    motionHits.push(now);
    if (motionHits.length >= 3) {
      motionHits = [];
      if (typeof window.simulate === 'function') window.simulate('gesture');
    }
  }

  async function startGestureListener() {
    if (motionListenerEnabled || !('DeviceMotionEvent' in window)) return false;
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        const permission = await DeviceMotionEvent.requestPermission();
        if (permission !== 'granted') return false;
      } catch (error) {
        return false;
      }
    }
    window.addEventListener('devicemotion', handleDeviceMotion, { passive: true });
    motionListenerEnabled = true;
    return true;
  }

  window.startDefenSysLiveTriggers = async () => {
    liveTriggerSessionStarted = true;
    startCodeWordListener();
    await startGestureListener();
  };

  window.stopDefenSysLiveTriggers = () => {
    if (typeof window.stopDefenSysCodeWordListener === 'function') {
      window.stopDefenSysCodeWordListener();
    }
    if (motionListenerEnabled) {
      window.removeEventListener('devicemotion', handleDeviceMotion);
      motionListenerEnabled = false;
    }
    liveTriggerSessionStarted = false;
  };

  // Start on first interaction anywhere
  document.addEventListener('click', () => {
    window.startDefenSysLiveTriggers();
  }, { once: true });

  const MAX_INLINE_AUDIO_CHARS = 900000;

  window.attachAudioToIncident = async (incidentId, base64DataUrl, durationSeconds) => {
    if (!db || !incidentId) return false;
    if (base64DataUrl && base64DataUrl.length > MAX_INLINE_AUDIO_CHARS) {
      console.warn('[DefenSys] Recording too large to store inline in Firestore.');
      return false;
    }

    try {
      await updateDoc(doc(db, 'incidents', incidentId), {
        audioBase64: base64DataUrl,
        audioDurationSeconds: durationSeconds ?? null,
        audioSavedAt: serverTimestamp()
      });
      return true;
    } catch (error) {
      console.error('[DefenSys] Failed to attach audio evidence:', error);
      return false;
    }
  };

  if(kind === 'codeword'){
    state.codeWord.lastTriggered = 'Just now';
    showToast('🎙️', 'Code Word Detected (“AEGIS”)', 'Emergency SOS sequence started via voice trigger.');
  }
  if(kind === 'lost-normal'){
    state.watchConnected = false;
    setRisk('low');
    render();
    return;
  }
  if(kind === 'lost-abnormal'){
    state.watchConnected = false;
    startEmergency();
    return;
  }
  state.screen = 'sos';
  startGrace();
}

function startGrace(){
  state.emergency = 'grace';
  state.graceLeft = 5;
  setRisk('moderate');
  render();
  clearInterval(state.graceTimer);
  state.graceTimer = setInterval(()=>{
    state.graceLeft -= 1;
    if(state.graceLeft <= 2) setRisk('high');
    if(state.graceLeft <= 0){
      clearInterval(state.graceTimer);
      startEmergency();
      return;
    }
    render();
  },1000);
}

function cancelGrace(){
  clearInterval(state.graceTimer);
  emergencyHistory.unshift({date:'Today', time: nowTime(), title:'False alarm', sub:'Cancelled by user during countdown', details:[]});

  setRisk('low');
  nav('home');
}

function startEmergency(){

  setRisk('critical');

async function startAudioRecording(){
  if(window.__defensysInsecureContext__){
    state.recording.status = 'denied';
    showToast('🔒', 'Recording blocked: insecure page', `You're viewing this over ${location.protocol} — browsers block the microphone/camera unless the page is served over https:// or http://localhost. Open this file through a local server (e.g. VS Code's "Live Server" extension, or run "python -m http.server" in its folder) instead of double-clicking it.`);
    render();
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.recording.status = 'denied';
    showToast('🎙️', 'Recording not supported', 'This browser does not support microphone/camera recording (mediaDevices API missing). Try the latest Chrome, Edge, or Safari.');
    render();
    return;
  }
  state.recording.status = 'requesting';
  render();

  let stream, mode;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
      video: {
        width: { ideal: 480, max: 640 },
        height: { ideal: 360, max: 480 },
        frameRate: { ideal: 24, max: 30 },
        facingMode: 'user'
      }
    });
    mode = 'audio+video';
  } catch(videoError){
    console.warn('[DefenSys] Camera unavailable, falling back to audio-only:', videoError.name, videoError.message);
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mode = 'audio-only';
    } catch(audioError){
      state.recording.status = 'denied';
      const reason =
        audioError.name === 'NotAllowedError' ? 'Microphone permission was denied. Check your browser\'s site settings and allow microphone access, then try again.' :
        audioError.name === 'NotFoundError' ? 'No microphone was found on this device.' :
        audioError.name === 'NotReadableError' ? 'The microphone is already in use by another app.' :
        `Recording failed: ${audioError.name || 'unknown error'} — ${audioError.message}`;
      console.error('[DefenSys] Audio recording failed:', audioError.name, audioError.message);
      showToast('🎙️', 'Recording unavailable', reason);
      render();
      return;
    }
  }

  state.recording.stream = stream;
  state.recording.mode = mode;
  state.recording.chunks = [];
  state.recording.startedAt = Date.now();

  let recorderOptions = undefined;
  if (typeof MediaRecorder.isTypeSupported === 'function') {
    if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) {
      recorderOptions = { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 600000 };
    } else if (MediaRecorder.isTypeSupported('video/mp4')) {
      recorderOptions = { mimeType: 'video/mp4', videoBitsPerSecond: 600000 };
    }
  }

  try {
    const recorder = recorderOptions ? new MediaRecorder(stream, recorderOptions) : new MediaRecorder(stream);
    state.recording.mediaRecorder = recorder;
    recorder.ondataavailable = e => { if(e.data && e.data.size > 0) state.recording.chunks.push(e.data); };
    recorder.onstop = () => finalizeRecording();
    recorder.start(1000);
  } catch(err) {
    const recorder = new MediaRecorder(stream);
    state.recording.mediaRecorder = recorder;
    recorder.ondataavailable = e => { if(e.data && e.data.size > 0) state.recording.chunks.push(e.data); };
    recorder.onstop = () => finalizeRecording();
    recorder.start();
  }

  state.recording.status = 'recording';
  render();
  attachLivePreview();
}

function stopAudioRecording(){
  const r = state.recording;
  if(r.mediaRecorder && r.status === 'recording'){
    try { r.mediaRecorder.stop(); } catch(e){}
  }
  if(r.stream){
    r.stream.getTracks().forEach(t => t.stop());
  }
}

function finalizeRecording(){
  const r = state.recording;
  const durationSecs = r.startedAt ? Math.round((Date.now() - r.startedAt)/1000) : null;
  const kind = r.mode === 'audio+video' ? 'video' : 'audio';
  const blob = new Blob(r.chunks, {type: kind === 'video' ? 'video/webm' : 'audio/webm'});
  const url = URL.createObjectURL(blob);
  r.lastClipUrl = url;
  r.lastClipDuration = durationSecs;
  r.status = 'saved';

  state.mediaLog.unshift({
    kind,
    url,
    duration: durationSecs,
    timestamp: nowTime(),
    date: 'Today'
  });
  render();

  const reader = new FileReader();
  reader.onloadend = () => {
    r.lastClipBase64 = reader.result;
    if(state.currentIncidentId && typeof window.attachAudioToIncident === 'function'){
      window.attachAudioToIncident(state.currentIncidentId, r.lastClipBase64, durationSecs);
    }
  };
  reader.readAsDataURL(blob);
}

function attachLivePreview(){
  const el = document.getElementById('livePreviewVideo');
  const stream = state.recording.stream;
  if(el && stream){
    if(el.srcObject !== stream){

    }

      el.play().catch(e => console.warn('[DefenSys] Live preview video auto-play prevented:', e.message));
    }
  }
}

function gaugeSvg(level, size, stroke, onColor){
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const info = RISK[level];
  const offset = c * (1 - info.pct);
  const trackColor = onColor ? 'rgba(255,255,255,0.28)' : null;
  const progressColor = onColor ? '#FFFFFF' : info.color;
  return `
    <svg width="${size}" height="${size}">
      <circle class="gauge-track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" ${trackColor ? `style="stroke:${trackColor}"` : ''}></circle>
      <circle class="gauge-progress" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"
        stroke="${progressColor}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
    </svg>`;
}

function sparkPoints(history, w, h){
  const min = Math.min(...history), max = Math.max(...history);
  const range = Math.max(1, max - min);
  return history.map((v,i)=>{
    const x = (i/(history.length-1)) * w;
    const y = h - ((v-min)/range) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}

async function handleAuthSubmit(){
  const email = document.getElementById('authEmail')?.value?.trim();
  const password = document.getElementById('authPassword')?.value;
  const name = document.getElementById('authName')?.value?.trim();

  if(!email || !password){
    state.authError = 'Please enter both an email and a password.';
    render();
    return;
  }
  state.authBusy = true;
  state.authError = null;
  render();

  const result = state.authScreen === 'signup'
    ? await window.defenSysSignUp(name, email, password)
    : await window.defenSysLogin(email, password);

  state.authBusy = false;
  if(!result.ok){
    state.authError = result.error || 'Something went wrong. Please try again.';
    render();
    return;
  }
}

function renderMap(){
  const loc = (typeof window.getDefenSysLocation === 'function') ? window.getDefenSysLocation() : {lat:null, lon:null};
  const hasCoords = loc && loc.lat !== null && loc.lon !== null;
  const mapsKey = window.GOOGLE_MAPS_API_KEY || '';
  const coordText = hasCoords ? `${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}` : 'Waiting for GPS fix…';
  const openInMapsUrl = hasCoords ? `https://www.google.com/maps?q=${loc.lat},${loc.lon}` : '#';

  let mapBody;
  if(mapsKey && hasCoords){
    mapBody = `<iframe width="100%" height="280" style="border:0; border-radius:22px;" loading="lazy"
        src="https://www.google.com/maps/embed/v1/place?key=${mapsKey}&q=${loc.lat},${loc.lon}&zoom=16"></iframe>`;
  } else {
    mapBody = `
    <div class="mapwrap">
      ${watermark(20)}
      <div class="map-road" style="left:0; right:0; top:96px; height:6px;"></div>
      <div class="map-road" style="left:0; right:0; top:190px; height:6px;"></div>
      <div class="map-road" style="left:120px; top:0; bottom:0; width:6px;"></div>
      <div class="map-road" style="left:230px; top:0; bottom:0; width:6px;"></div>
      <div class="map-pin" style="left:50%; top:58%;"><div class="dot-outer"><div class="dot-inner"></div></div></div>
      <div class="zone-pin" style="left:26%; top:30%;"><div class="zp">⚠️</div></div>
      <div class="zone-pin" style="left:78%; top:74%;"><div class="zp">⚠️</div></div>
    </div>`;
  }

  return `
    ${brandHeader()}
    <h1 class="title">Live location</h1>
    ${mapBody}
    ${!mapsKey ? `<div class="notice-row row"><div class="ic" style="background:var(--card);">🗺️</div><div><div class="name" style="font-size:11.5px;">Add a Google Maps API key to see a real embedded map</div><div class="meta">Showing an illustrated placeholder until then — real GPS coordinates below are already live</div></div></div>` : ''}
    <div class="map-card">
      ${watermark(16)}
      <div class="ic" style="background:var(--blue-dim); color:var(--blue);">📍</div>
      <div>
        <div class="name">${coordText}</div>
        <div class="meta">Live location sharing with ${contacts.length} contacts</div>
      </div>
    </div>
    <a href="${openInMapsUrl}" target="_blank" rel="noopener" class="row" style="text-decoration:none; cursor:${hasCoords ? 'pointer' : 'default'}; opacity:${hasCoords ? '1' : '0.5'};">
      <div class="ic" style="background:var(--teal-dim); color:var(--teal);">🧭</div>
      <div><div class="name">Open in Google Maps</div><div class="meta">${hasCoords ? 'Uses your real device location' : 'Available once GPS location is ready'}</div></div>
      <span style="margin-left:auto; color:var(--text-faint);">›</span>
    </a>
    <div class="map-card">
      ${watermark(16)}
      <div class="ic" style="background:var(--mod-dim); color:var(--mod);">⚠️</div>
      <div>
        <div class="name">2 threat zones nearby</div>
        <div class="meta">Detection sensitivity automatically increased</div>
      </div>
    </div>
  `;

              stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
          </svg>
          <button class="sos-btn" onclick="cancelGrace()" style="width:164px; height:164px; background:#fff; color:var(--text); border:1px solid var(--border-strong); box-shadow:var(--shadow-lg);">

      <div class="row"><div class="ic">⚪</div><div><div class="name">SMS</div><div class="meta">Fallback when data is unavailable</div></div><span class="badge pending">Standby</span></div>

  `;
}

function render(){
  const wp = document.getElementById('watchpill');
  if(wp){
    wp.className = 'watchpill ' + (state.watchConnected ? 'connected':'disconnected');
  }
  const wt = document.getElementById('wtext');
  if(wt){
    wt.textContent = state.watchConnected ? 'Watch connected' : 'Watch disconnected';
  }

  const el = document.getElementById('screen');
  if(!el) return;

  if(state.emergency === 'active'){
    const existingVideo = document.getElementById('livePreviewVideo');
    if(!existingVideo || state.recording.status !== 'recording'){
      el.innerHTML = renderEmergency();
    }
    attachLivePreview();
    return;
  }
  if(state.emergency === 'grace'){
    el.innerHTML = renderSOS();
    return;
  }
  if(state.screen === 'home' && !state.watchConnected){
    el.innerHTML = renderWatchLost();
    return;
  }
  if(state.screen === 'home') el.innerHTML = renderHome();
  else if(state.screen === 'sos') el.innerHTML = renderSOS();
  else if(state.screen === 'vitals') el.innerHTML = renderVitals();
  else if(state.screen === 'zones') el.innerHTML = renderZones();
  else if(state.screen === 'contacts') el.innerHTML = renderContacts();
  else if(state.screen === 'settings') el.innerHTML = renderSettings();
  else if(state.screen === 'profile') el.innerHTML = renderProfile();
  else if(state.screen === 'map') el.innerHTML = renderMap();
  else if(state.screen === 'history') el.innerHTML = renderHistory();
  else if(state.screen === 'evidence') el.innerHTML = renderEvidence();
  else if(state.screen === 'auth') el.innerHTML = renderAuth();

  attachLivePreview();
}

window.__defensysAuthReady__ = function(user){
  if(user){
    state.profile.name = user.displayName || state.profile.name;
    state.profile.email = user.email;
    state.authError = null;
    if(state.screen === 'auth') state.screen = 'home';
  } else if(!state.skippedAuth && state.screen !== 'auth'){
    state.screen = 'auth';
  }
  render();
};

render();
window.__defensysRerender__ = render;
setInterval(tickVitals, 2000);
</script>
